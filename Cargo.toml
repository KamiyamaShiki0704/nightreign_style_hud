[workspace]
resolver = "2"
members = [
    "examples/nightreign-style-hud",
    "examples/nightreign-precision-aim",
    "examples/nightreign-attack-summon",
    "examples/nightreign-camera-debug",
]
default-members = [
    "examples/nightreign-style-hud",
    "examples/nightreign-precision-aim",
    "examples/nightreign-attack-summon",
    "examples/nightreign-camera-debug",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
repository = "https://github.com/KamiyamaShiki0704/nightreign_style_hud"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fromsoftware-shared = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "f96aa78e26d51838c31c411e05a41834631d54d5", package = "fromsoftware-shared" }
eldenring = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "f96aa78e26d51838c31c411e05a41834631d54d5", package = "eldenring" }
debug = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "f96aa78e26d51838c31c411e05a41834631d54d5", package = "debug" }
bitflags = "2.11.0"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2.3"
tracing-panic = "0.1"
glam = ">= 0.30"
byteorder = "1"
pelite = "0.10"
vtable-rs = "0.1.4"
bitfield = "0.19.2"
encoding_rs = "0.8.35"
libhotpatch = "1.1.0"
toml = "1.0.3"
num_enum = "0.7"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[workspace.dependencies.hudhook]
git = "https://github.com/veeenu/hudhook"
features = ["imgui-tables-api"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
